server:
  address: 127.0.0.1
  port: ${EAP_SERVER_PORT:8080}
spring:
  ai:
    model:
      chat: ${EAP_AI_PROVIDER:none}
      embedding: none
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${EAP_AI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${EAP_AI_MODEL:gpt-4.1-mini}
      timeout: 30s
      max-retries: 0
    retry:
      max-attempts: 1
  application:
    name: eap-runtime
  devtools:
    restart:
      enabled: true
  datasource:
    url: ${EAP_DB_URL:jdbc:postgresql://localhost:54321/postgres?currentSchema=eap}
    username: ${EAP_DB_USERNAME:postgres}
    password: ${EAP_DB_PASSWORD:1269482226lh.}
  flyway:
    locations: classpath:db/migration
    schemas: eap
    default-schema: eap
management:
  endpoints:
    web:
      exposure:
        include: health,info
eap:
  runtime:
    # Shared authorized root. The legacy eap.ai.authorized-root key is only a fallback.
    # If both are set to different directories, execution is refused instead of widened.
    authorized-root: ${EAP_AUTHORIZED_ROOT:}
  ai:
    authorized-root: ${EAP_AI_AUTHORIZED_ROOT:}
    artifact-root: ${EAP_AI_ARTIFACT_ROOT:.eap-ai-artifacts}
  llm:
    # A model is consulted only when the deterministic result is not decisive or the operator
    # explicitly requests it. Disabled by default; the pipeline stays fully deterministic.
    enabled: ${EAP_LLM_ENABLED:false}
    temperature: ${EAP_LLM_TEMPERATURE:0.1}
    # Hard budget applied by the preprocessing stage before any request is sent.
    max-prompt-tokens: ${EAP_LLM_MAX_PROMPT_TOKENS:1800}
    max-completion-tokens: ${EAP_LLM_MAX_COMPLETION_TOKENS:700}
    cache-entries: ${EAP_LLM_CACHE_ENTRIES:64}
# EAP_ADOPT_EXISTING_SCHEMA is deliberately NOT set here. Adopting a pre-existing schema is a
# one-time operator decision taken at the moment they have inspected it, so it belongs on the
# command line or in the environment of that single start -- never in the committed config, where
# it would silently disable the guard in `MigrationConfiguration` for every future run.
