# IDEA's AppMainV2 invokes the application through its own defining loader.
# Restart the wrapper with the application to keep bean types in one loader.
restart.include.idealauncher=/idea_rt\\.jar
# Keep all EAP library jars in the same restart loader.
restart.include.eapmodules=/eap-(api|engine(?:-[a-z]+)*|ai(?:-[a-z]+)*|web(?:-[a-z]+)*|spring(?:-[a-z]+)*)-[\\w.-]+\\.jar
