<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-fs="md" data-density="comfortable">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EAP 工程自动化平台 · 界面重构原型</title>
<style>
/* ============================================================
   EAP Design System — 深色专业工作台（支持浅色 / 字号 / 密度切换）
   单文件可交互原型；内容为模拟，不代表真实后端执行。
   ============================================================ */
:root{
  --bg-base:#0a0e14; --bg-rail:#0d1219; --bg-side:#111821; --bg-main:#141c26;
  --bg-surface:#18212c; --bg-surface-2:#1d2733; --bg-elevated:#222e3b;
  --bg-hover:#263342; --bg-active:#2b3a4b;
  --line:#232f3d; --line-strong:#334355; --line-soft:#1b2530;
  --tx:#e7eef6; --tx-soft:#a7b6c7; --tx-mute:#71839a; --tx-faint:#55667a;
  --accent:#5b8cff; --accent-2:#38bdf8; --accent-soft:rgba(91,140,255,.14); --accent-line:rgba(91,140,255,.42);
  --brand-grad:linear-gradient(135deg,#5b8cff,#38bdf8);
  --ok:#3fb950; --ok-bg:rgba(63,185,80,.12); --ok-line:rgba(63,185,80,.35);
  --warn:#d9a520; --warn-bg:rgba(217,165,32,.12); --warn-line:rgba(217,165,32,.35);
  --danger:#f2555a; --danger-bg:rgba(242,85,90,.12); --danger-line:rgba(242,85,90,.35);
  --info:#58a6ff; --info-bg:rgba(88,166,255,.12); --info-line:rgba(88,166,255,.35);
  --unknown:#b083f0; --unknown-bg:rgba(176,131,240,.13); --unknown-line:rgba(176,131,240,.38);
  --neutral:#8fa1b5; --neutral-bg:rgba(143,161,181,.12);
  --r-lg:14px; --r:10px; --r-sm:7px; --r-xs:5px;
  --sp1:4px; --sp2:8px; --sp3:12px; --sp4:16px; --sp5:20px; --sp6:24px; --sp7:32px;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.28);
  --shadow-pop:0 8px 28px rgba(0,0,0,.5),0 0 0 1px var(--line-strong);
  --ring:0 0 0 2px var(--accent);
  --rail-w:60px; --side-w:264px; --panel-w:340px; --top-h:48px; --status-h:26px;
  --fs-xs:11px; --fs-sm:12px; --fs-md:13px; --fs-base:14px; --fs-lg:16px; --fs-xl:20px;
  --font:Inter,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",ui-sans-serif,system-ui,sans-serif;
  --mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
}
:root[data-theme="light"]{
  --bg-base:#eef2f7; --bg-rail:#e7ecf3; --bg-side:#f5f7fa; --bg-main:#fbfcfe;
  --bg-surface:#ffffff; --bg-surface-2:#f1f4f8; --bg-elevated:#ffffff;
  --bg-hover:#e6ebf2; --bg-active:#dbe3ee;
  --line:#d6dee9; --line-strong:#b9c6d6; --line-soft:#e8edf4;
  --tx:#1b2634; --tx-soft:#43536a; --tx-mute:#6b7c92; --tx-faint:#94a3b6;
  --accent:#2563eb; --accent-2:#0891b2; --accent-soft:rgba(37,99,235,.10); --accent-line:rgba(37,99,235,.38);
  --brand-grad:linear-gradient(135deg,#2563eb,#0891b2);
  --ok:#1a7f37; --ok-bg:rgba(26,127,55,.10); --ok-line:rgba(26,127,55,.32);
  --warn:#a16207; --warn-bg:rgba(161,98,7,.10); --warn-line:rgba(161,98,7,.32);
  --danger:#c62828; --danger-bg:rgba(198,40,40,.10); --danger-line:rgba(198,40,40,.32);
  --info:#1d6fc4; --info-bg:rgba(29,111,196,.10); --info-line:rgba(29,111,196,.32);
  --unknown:#7c3aed; --unknown-bg:rgba(124,58,237,.10); --unknown-line:rgba(124,58,237,.32);
  --neutral:#5b6b80; --neutral-bg:rgba(91,107,128,.10);
  --shadow:0 1px 2px rgba(20,30,45,.06),0 12px 30px rgba(20,30,45,.10);
  --shadow-pop:0 10px 32px rgba(20,30,45,.18),0 0 0 1px var(--line-strong);
}
:root[data-fs="small"]{--fs-xs:10px;--fs-sm:11px;--fs-md:12px;--fs-base:13px;--fs-lg:15px;--fs-xl:18px}
:root[data-fs="large"]{--fs-xs:12px;--fs-sm:13px;--fs-md:14px;--fs-base:15px;--fs-lg:17px;--fs-xl:22px}
:root[data-density="compact"]{--rail-w:52px;--side-w:232px;--panel-w:300px;--top-h:44px;--sp4:12px;--sp5:14px;--sp6:18px;--sp7:24px}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font);font-size:var(--fs-base);color:var(--tx);background:var(--bg-base);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:none;box-shadow:var(--ring);border-radius:var(--r-xs)}
[hidden]{display:none!important}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#2c3a49;border-radius:8px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:#3a4b5e;background-clip:padding-box;border:2px solid transparent}
:root[data-theme="light"] ::-webkit-scrollbar-thumb{background:#c3cedd;background-clip:padding-box;border:2px solid transparent}
svg{display:block}

/* ---------- 外壳 ---------- */
.app{display:grid;grid-template-rows:var(--top-h) 1fr var(--status-h);height:100vh}
.workspace{display:grid;grid-template-columns:var(--rail-w) var(--side-w) minmax(0,1fr) 0;grid-template-rows:minmax(0,1fr);min-height:0;overflow:hidden;transition:grid-template-columns .18s ease}
.workspace.panel-open{grid-template-columns:var(--rail-w) var(--side-w) minmax(0,1fr) var(--panel-w)}
.workspace.side-collapsed{grid-template-columns:var(--rail-w) 0 minmax(0,1fr) 0}
.workspace.side-collapsed.panel-open{grid-template-columns:var(--rail-w) 0 minmax(0,1fr) var(--panel-w)}

.topbar{display:flex;align-items:center;gap:var(--sp3);padding:0 var(--sp4);background:var(--bg-rail);border-bottom:1px solid var(--line);z-index:20}
.icon-btn{width:30px;height:30px;display:grid;place-items:center;border-radius:var(--r-sm);color:var(--tx-mute);flex:none;transition:background .15s,color .15s}
.icon-btn:hover{background:var(--bg-hover);color:var(--tx)}
.brand{display:flex;align-items:center;gap:var(--sp2);font-weight:800;letter-spacing:.02em;font-size:var(--fs-base);padding-right:var(--sp2)}
.brand .logo{width:22px;height:22px;border-radius:6px;background:var(--brand-grad);display:grid;place-items:center;color:#06121f;font-weight:900;font-size:13px;box-shadow:0 0 18px rgba(91,140,255,.35)}
.brand em{font-style:normal;color:var(--tx-mute);font-weight:600;font-size:var(--fs-sm)}
.crumb{display:flex;align-items:center;gap:var(--sp2);min-width:0;color:var(--tx-mute);font-size:var(--fs-md)}
.crumb .seg{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.crumb .seg.cur{color:var(--tx);font-weight:600}
.crumb .sep{color:var(--tx-faint)}
.top-tools{display:flex;align-items:center;gap:2px;margin-left:auto}
.tool-btn{display:flex;align-items:center;gap:6px;padding:6px 9px;border-radius:var(--r-sm);color:var(--tx-soft);font-size:var(--fs-sm);font-weight:600;white-space:nowrap}
.tool-btn:hover{background:var(--bg-hover);color:var(--tx)}
.tool-btn.on{background:var(--accent-soft);color:var(--accent)}
.run-chip{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:var(--fs-xs);font-weight:700;border:1px solid var(--line)}
.run-chip.running{color:var(--accent);background:var(--accent-soft);border-color:var(--accent-line)}
.run-chip.idle{color:var(--tx-mute);background:var(--bg-surface)}
.run-chip .pulse{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.3;transform:scale(.8)}}
.sim-tag{font-size:10px;font-weight:700;letter-spacing:.06em;color:#0a0e14;background:linear-gradient(135deg,#f0c56b,#e8a13a);padding:3px 7px;border-radius:5px}

.rail{background:var(--bg-rail);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:var(--sp3) 0 var(--sp2);gap:var(--sp2);z-index:15;min-height:0}
.rail-entry{position:relative;width:46px;height:48px;border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--tx-mute);transition:color .15s,background .15s}
.rail-entry svg{width:20px;height:20px}
.rail-entry span{font-size:10px;font-weight:600;letter-spacing:.01em}
.rail-entry:hover{color:var(--tx-soft);background:var(--bg-surface)}
.rail-entry.active{color:var(--accent);background:var(--accent-soft)}
.rail-entry.active::before{content:"";position:absolute;left:-7px;top:11px;bottom:11px;width:3px;border-radius:0 3px 3px 0;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.rail-entry.bottom{margin-top:auto}
.rail-badge{position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--warn)}

.sidebar{background:var(--bg-side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.side-head{display:flex;align-items:center;gap:var(--sp2);padding:var(--sp4) var(--sp4) var(--sp3)}
.side-head h2{font-size:var(--fs-base);margin:0;font-weight:700;letter-spacing:.01em}
.side-head .add{margin-left:auto;width:26px;height:26px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--tx-soft);background:var(--bg-surface);border:1px solid var(--line)}
.side-head .add:hover{color:var(--accent);border-color:var(--accent-line)}
.side-scroll{overflow:auto;flex:1;padding:0 var(--sp2) var(--sp4)}
.side-search{display:flex;align-items:center;gap:8px;margin:0 var(--sp2) var(--sp3);padding:7px 10px;background:var(--bg-base);border:1px solid var(--line);border-radius:var(--r-sm);color:var(--tx-mute)}
.side-search input{background:none;border:0;outline:0;width:100%;font-size:var(--fs-sm)}
.side-search input::placeholder{color:var(--tx-faint)}
.group-label{font-size:var(--fs-xs);font-weight:700;letter-spacing:.12em;color:var(--tx-faint);padding:var(--sp3) var(--sp3) var(--sp1);text-transform:uppercase}
.proj{display:flex;align-items:center;gap:8px;padding:7px var(--sp3);border-radius:var(--r-sm);font-size:var(--fs-md);font-weight:600;color:var(--tx-soft)}
.proj .caret{color:var(--tx-faint);transition:transform .15s}
.proj .caret.open{transform:rotate(90deg)}
.proj .pdot{width:7px;height:7px;border-radius:2px;background:var(--accent-2)}
.proj .plabel{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.proj .pnum{font-size:var(--fs-xs);color:var(--tx-faint);font-weight:500}
.sess{display:flex;gap:8px;padding:8px 10px 8px 24px;border-radius:var(--r-sm);cursor:pointer;position:relative}
.sess:hover{background:var(--bg-surface)}
.sess.active{background:var(--accent-soft)}
.sess.active::after{content:"";position:absolute;right:8px;top:50%;transform:translateY(-50%);width:5px;height:5px;border-radius:50%;background:var(--accent)}
.sess .sdot{width:7px;height:7px;border-radius:50%;margin-top:5px;flex:none}
.sdot.running{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sdot.approval{background:var(--warn);box-shadow:0 0 0 3px var(--warn-bg)}
.sdot.done{background:var(--ok)}
.sdot.idle{background:var(--tx-faint)}
.sess .smain{min-width:0;flex:1}
.sess .stitle{font-size:var(--fs-md);color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4}
.sess .smeta{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:var(--fs-xs);color:var(--tx-mute)}
.sess .smeta .tag{padding:1px 5px;border-radius:4px;background:var(--bg-surface-2);color:var(--tx-mute)}
.side-foot{padding:var(--sp3) var(--sp4);border-top:1px solid var(--line);font-size:var(--fs-xs);color:var(--tx-faint);line-height:1.6}
.side-foot b{color:var(--tx-mute)}

.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg-main);position:relative}
.stage-head{display:flex;align-items:center;gap:var(--sp3);padding:var(--sp4) var(--sp6) var(--sp3);border-bottom:1px solid var(--line-soft);flex:none}
.stage-head .eyebrow{font-size:var(--fs-xs);font-weight:700;letter-spacing:.13em;color:var(--accent);text-transform:uppercase}
.stage-head h1{font-size:var(--fs-xl);margin:3px 0 0;font-weight:750;letter-spacing:-.02em}
.stage-head .sub{color:var(--tx-mute);font-size:var(--fs-sm);margin-top:3px}
.stage-head .head-actions{margin-left:auto;display:flex;gap:var(--sp2);align-items:center}
.stage-body{flex:1;overflow:auto;min-height:0;padding:var(--sp5) var(--sp6)}

.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:var(--r-sm);font-size:var(--fs-md);font-weight:650;background:var(--bg-surface-2);border:1px solid var(--line-strong);color:var(--tx)}
.btn:hover{background:var(--bg-hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#06121f}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--tx-soft)}
.btn.ghost:hover{background:var(--bg-surface)}
.btn.danger{background:var(--danger-bg);border-color:var(--danger-line);color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:var(--fs-sm)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:var(--fs-xs);font-weight:700;border:1px solid var(--line)}
.chip .d{width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.ok{color:var(--ok);background:var(--ok-bg);border-color:var(--ok-line)}
.chip.warn{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-line)}
.chip.danger{color:var(--danger);background:var(--danger-bg);border-color:var(--danger-line)}
.chip.info{color:var(--info);background:var(--info-bg);border-color:var(--info-line)}
.chip.unknown{color:var(--unknown);background:var(--unknown-bg);border-color:var(--unknown-line)}
.chip.neutral{color:var(--neutral);background:var(--neutral-bg)}
.muted{color:var(--tx-mute)}
.mono{font-family:var(--mono)}
.hint{color:var(--tx-mute);font-size:var(--fs-sm);line-height:1.7}
.divider{height:1px;background:var(--line);margin:var(--sp4) 0}
.pill-tabs{display:inline-flex;gap:3px;padding:3px;background:var(--bg-base);border:1px solid var(--line);border-radius:var(--r-sm);flex-wrap:wrap}
.pill-tabs button{padding:6px 12px;border-radius:var(--r-xs);font-size:var(--fs-sm);font-weight:600;color:var(--tx-mute)}
.pill-tabs button:hover{color:var(--tx-soft)}
.pill-tabs button.on{background:var(--bg-surface-2);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.3)}

/* 会话流 */
.thread{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:var(--sp4)}
.msg{display:flex;gap:var(--sp3);align-items:flex-start}
.msg .avatar{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;font-weight:800;font-size:12px}
.msg.user .avatar{background:linear-gradient(135deg,#35507a,#243b5e);color:#cfe0ff}
.msg.bot .avatar{background:var(--brand-grad);color:#06121f}
.msg .bubble{flex:1;min-width:0}
.msg .who{font-size:var(--fs-sm);font-weight:700;color:var(--tx-soft);margin-bottom:5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.msg .who time{font-weight:500;color:var(--tx-faint);font-size:var(--fs-xs)}
.msg .text{font-size:var(--fs-base);line-height:1.75;color:var(--tx)}
.msg .text p{margin:0 0 8px}
.msg .text p:last-child{margin-bottom:0}
.msg .text code{font-family:var(--mono);font-size:12.5px;background:var(--bg-surface-2);border:1px solid var(--line);padding:1px 5px;border-radius:4px;color:#9fd0ff}
.card{background:var(--bg-surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-hd{display:flex;align-items:center;gap:var(--sp2);padding:var(--sp3) var(--sp4);border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.card-hd .t{font-size:var(--fs-md);font-weight:700}
.card-hd .sub{color:var(--tx-mute);font-size:var(--fs-xs);font-weight:500}
.card-hd .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.card-bd{padding:var(--sp4)}
.timeline{display:flex;flex-direction:column}
.tl-node{display:flex;gap:var(--sp3);position:relative;padding-bottom:var(--sp4)}
.tl-node:last-child{padding-bottom:0}
.tl-node::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:1px;background:var(--line)}
.tl-node:last-child::before{display:none}
.tl-ic{width:23px;height:23px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--bg-surface-2);border:1px solid var(--line-strong);color:var(--tx-soft);z-index:1}
.tl-ic.ok{color:var(--ok);border-color:var(--ok-line);background:var(--ok-bg)}
.tl-ic.warn{color:var(--warn);border-color:var(--warn-line);background:var(--warn-bg)}
.tl-ic.act{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
.tl-body{flex:1;min-width:0;padding-top:1px}
.tl-title{font-size:var(--fs-md);font-weight:650;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tl-desc{font-size:var(--fs-sm);color:var(--tx-mute);margin-top:3px;line-height:1.6}
.tl-desc .mono{color:var(--tx-soft)}
.state-triad{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp3);margin-top:var(--sp2)}
.state-cell{background:var(--bg-base);border:1px solid var(--line);border-radius:var(--r-sm);padding:var(--sp3)}
.state-cell .k{font-size:var(--fs-xs);color:var(--tx-mute);font-weight:700;letter-spacing:.05em}
.state-cell .v{margin-top:7px;display:flex;align-items:center;gap:7px;font-size:var(--fs-md);font-weight:700}
.diff-file{border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;margin-top:var(--sp3)}
.diff-file .fhd{display:flex;align-items:center;gap:8px;padding:8px 11px;background:var(--bg-surface-2);font-size:var(--fs-sm)}
.diff-file .fhd .path{font-family:var(--mono);color:var(--tx-soft)}
.diff-file .fhd .stat{margin-left:auto;font-family:var(--mono);font-size:var(--fs-xs)}
.diff-file .stat .add{color:var(--ok)} .diff-file .stat .del{color:var(--danger)}
.diff-line{font-family:var(--mono);font-size:12px;line-height:1.7;padding:1px 12px;white-space:pre;overflow:auto}
.diff-line.add{background:rgba(63,185,80,.09);color:#a9e7b4}
.diff-line.del{background:rgba(242,85,90,.09);color:#ffb3b6}
.diff-line.ctx{color:var(--tx-mute)}
.diff-line .pfx{display:inline-block;width:14px;color:var(--tx-faint);user-select:none}
.approval-box{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:var(--r);padding:var(--sp4)}
.approval-box h4{margin:0 0 6px;font-size:var(--fs-md);color:var(--warn)}
.approval-box p{margin:0 0 var(--sp3);font-size:var(--fs-sm);color:var(--tx-soft);line-height:1.6}
.approval-box .acts{display:flex;gap:var(--sp2);flex-wrap:wrap}
.evi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:var(--sp3)}
.evi{border:1px solid var(--line);border-radius:var(--r-sm);padding:var(--sp3);background:var(--bg-base)}
.evi .cmd{font-family:var(--mono);font-size:12px;color:var(--tx-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evi .meta{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:var(--fs-xs);color:var(--tx-mute)}
.empty{border:1px dashed var(--line-strong);border-radius:var(--r);padding:var(--sp7) var(--sp5);text-align:center;color:var(--tx-mute)}
.empty .ico{width:46px;height:46px;margin:0 auto var(--sp3);border-radius:14px;background:var(--bg-surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--tx-faint)}
.empty h3{margin:0 0 6px;color:var(--tx-soft);font-size:var(--fs-base)}
.empty p{margin:0 auto;max-width:440px;font-size:var(--fs-sm);line-height:1.7}

/* 输入区 */
.composer{flex:none;padding:0 var(--sp6) var(--sp4);position:relative}
.composer-inner{max-width:900px;margin:0 auto;background:var(--bg-surface);border:1px solid var(--line-strong);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.composer-inner:focus-within{border-color:var(--accent-line)}
.refs{display:flex;flex-wrap:wrap;gap:6px;padding:var(--sp3) var(--sp4) 0}
.ref{display:inline-flex;align-items:center;gap:6px;padding:4px 8px;border-radius:var(--r-sm);background:var(--bg-surface-2);border:1px solid var(--line);font-size:var(--fs-sm);color:var(--tx-soft)}
.ref .x{color:var(--tx-mute);font-size:14px;line-height:1}
.ref .x:hover{color:var(--danger)}
.composer textarea{width:100%;border:0;outline:0;resize:none;background:none;padding:var(--sp3) var(--sp4);font-size:var(--fs-base);line-height:1.6;min-height:56px;max-height:160px;color:var(--tx)}
.composer textarea::placeholder{color:var(--tx-faint)}
.compose-bar{display:flex;align-items:center;gap:6px;padding:var(--sp2) var(--sp3) var(--sp3);flex-wrap:wrap}
.compose-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:var(--r-sm);color:var(--tx-soft);font-size:var(--fs-sm);font-weight:600;border:1px solid transparent}
.compose-btn:hover{background:var(--bg-surface-2);border-color:var(--line)}
.compose-btn svg{width:15px;height:15px;color:var(--tx-mute)}
.compose-btn .chev{font-size:10px;color:var(--tx-faint)}
.ctx-state{font-size:var(--fs-xs);color:var(--tx-mute);display:flex;align-items:center;gap:6px;padding:0 6px}
.send{margin-left:auto;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--accent);color:#06121f;flex:none;transition:filter .15s}
.send:hover{filter:brightness(1.1)}
.send:disabled{background:var(--bg-surface-2);color:var(--tx-faint);cursor:not-allowed}

/* 终端底栏 */
.terminal{height:0;flex:none;overflow:hidden;border-top:1px solid var(--line);background:#0b1016;transition:height .18s ease}
.terminal.open{height:186px}
.terminal-hd{display:flex;align-items:center;gap:var(--sp2);padding:7px var(--sp5);border-bottom:1px solid var(--line);font-size:var(--fs-sm);color:var(--tx-soft)}
.terminal-hd .t{font-weight:700}
.terminal-body{height:calc(100% - 33px);overflow:auto;padding:var(--sp3) var(--sp5);font-family:var(--mono);font-size:12px;line-height:1.75;color:#9fb0c4}
.terminal-body .ln .ok{color:#3fb950}
.terminal-body .ln .ac{color:#5b8cff}

/* ---------- 右侧检查器（多标签） ---------- */
.panel{background:var(--bg-side);border-left:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column;min-width:0;min-height:0}
.insp-tabs{display:flex;gap:1px;padding:6px 6px 0;border-bottom:1px solid var(--line);flex:none;overflow-x:auto}
.insp-tab{display:flex;align-items:center;gap:5px;padding:7px 9px;font-size:var(--fs-xs);font-weight:700;color:var(--tx-mute);border-bottom:2px solid transparent;white-space:nowrap}
.insp-tab:hover{color:var(--tx-soft)}
.insp-tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.panel-hd{display:flex;align-items:center;gap:var(--sp2);padding:var(--sp3) var(--sp4);border-bottom:1px solid var(--line);flex:none}
.panel-hd h3{font-size:var(--fs-md);margin:0;font-weight:700}
.panel-hd .x{margin-left:auto;color:var(--tx-mute);width:26px;height:26px;display:grid;place-items:center;border-radius:var(--r-sm)}
.panel-hd .x:hover{background:var(--bg-hover);color:var(--tx)}
.panel-scroll{overflow:auto;flex:1;padding:var(--sp4)}
.sum-block{margin-bottom:var(--sp5)}
.sum-block h4{font-size:var(--fs-xs);letter-spacing:.1em;text-transform:uppercase;color:var(--tx-faint);margin:0 0 var(--sp3)}
.kv{display:flex;justify-content:space-between;gap:var(--sp3);padding:6px 0;font-size:var(--fs-sm);border-bottom:1px solid var(--line-soft)}
.kv .k{color:var(--tx-mute)}
.kv .v{color:var(--tx);text-align:right;font-weight:600}
.kv .v.unknown{color:var(--unknown)}
.tree{font-size:var(--fs-md);overflow:auto}
.tree-node{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:var(--r-xs);cursor:pointer;color:var(--tx-soft);white-space:nowrap}
.tree-node:hover,.tree-node.sel{background:var(--bg-surface)}
.tree-node.sel{color:var(--accent)}
.tree-node .caret{color:var(--tx-faint);width:12px;flex:none}
.tree-node .fi{width:15px;flex:none;color:var(--accent-2)}
.tree-node .fi.folder{color:var(--warn)}
.tree-node small{color:var(--tx-faint);margin-left:auto;font-family:var(--mono);font-size:10px}
.tree-node .badge{font-size:9px;font-weight:800;padding:0 4px;border-radius:3px;margin-left:4px}

/* Git 提交图 */
.git-graph{position:relative;padding-left:6px}
.gcommit{display:flex;gap:10px;position:relative;padding-bottom:14px}
.gcommit:last-child{padding-bottom:0}
.gcommit::before{content:"";position:absolute;left:9px;top:20px;bottom:-2px;width:2px;background:var(--line)}
.gcommit:last-child::before{display:none}
.gcdot{width:20px;height:20px;border-radius:50%;flex:none;display:grid;place-items:center;border:2px solid var(--accent);background:var(--bg-side);z-index:1;color:var(--accent)}
.gcdot.merged{border-color:var(--ok);color:var(--ok)}
.gcdot.remote{border-color:var(--tx-faint);color:var(--tx-faint)}
.gcbody{flex:1;min-width:0}
.gcmsg{font-size:var(--fs-sm);font-weight:650;line-height:1.45}
.gcmeta{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:var(--fs-xs);color:var(--tx-mute);flex-wrap:wrap}
.gchash{font-family:var(--mono);color:var(--accent);font-size:var(--fs-xs)}
.branch-tag{font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.branch-tag.head{background:var(--ok-bg);color:var(--ok)}

/* 浏览器预览 mock */
.webview{border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--bg-surface)}
.webbar{display:flex;align-items:center;gap:6px;padding:7px 9px;background:var(--bg-surface-2);border-bottom:1px solid var(--line)}
.wdot{width:8px;height:8px;border-radius:50%;background:var(--line-strong)}
.wurl{flex:1;background:var(--bg-base);border:1px solid var(--line);border-radius:5px;padding:4px 8px;font-family:var(--mono);font-size:10px;color:var(--tx-mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wpage{background:linear-gradient(180deg,var(--bg-base),var(--bg-surface));min-height:210px;padding:14px;display:flex;flex-direction:column;gap:9px}
.wph{height:9px;border-radius:4px;background:var(--bg-surface-2)}
.wph.w40{width:40%}.wph.w60{width:60%}.wph.w80{width:80%}.wph.w100{width:100%}
.wblock{height:34px;border-radius:var(--r-sm);background:var(--bg-surface-2);border:1px solid var(--line-soft)}

/* 场景 / 专家 / 设置卡片 */
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:var(--sp4);max-width:1100px}
.obj-card{background:var(--bg-surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--sp4);cursor:pointer;transition:border-color .15s,transform .15s,box-shadow .15s}
.obj-card:hover{border-color:var(--line-strong);transform:translateY(-2px);box-shadow:var(--shadow)}
.obj-card.sel{border-color:var(--accent-line);box-shadow:0 0 0 1px var(--accent-line)}
.obj-card.disabled{opacity:.55}
.obj-card .oc-top{display:flex;align-items:flex-start;gap:var(--sp3)}
.obj-card .oc-ic{width:38px;height:38px;border-radius:10px;flex:none;display:grid;place-items:center;background:var(--bg-surface-2);border:1px solid var(--line);color:var(--accent)}
.obj-card .oc-t{font-size:var(--fs-base);font-weight:700}
.obj-card .oc-d{font-size:var(--fs-sm);color:var(--tx-mute);margin-top:2px;line-height:1.5}
.obj-card .oc-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:var(--sp3)}
.obj-card .oc-foot{display:flex;align-items:center;gap:8px;margin-top:var(--sp3);padding-top:var(--sp3);border-top:1px solid var(--line-soft);font-size:var(--fs-xs);color:var(--tx-mute)}

/* 分步向导 */
.stepper{display:flex;align-items:flex-start;gap:0;margin-bottom:var(--sp5);flex-wrap:wrap}
.step{flex:1;min-width:110px;position:relative;text-align:center;cursor:pointer}
.step::after{content:"";position:absolute;top:15px;left:50%;width:100%;height:2px;background:var(--line);z-index:0}
.step:last-child::after{display:none}
.step.done::after{background:var(--ok)}
.step-num{width:30px;height:30px;border-radius:50%;border:2px solid var(--line-strong);background:var(--bg-surface);display:grid;place-items:center;margin:0 auto 6px;font-size:12px;font-weight:800;color:var(--tx-mute);position:relative;z-index:1}
.step.on .step-num{border-color:var(--accent);background:var(--accent);color:#06121f}
.step.done .step-num{border-color:var(--ok);background:var(--ok);color:#06121f}
.step-lb{font-size:var(--fs-xs);color:var(--tx-mute);font-weight:600}
.step.on .step-lb{color:var(--accent)}

/* 详情 / 表单工作面 */
.detail-wrap{max-width:1000px}
.sec{background:var(--bg-surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:var(--sp4);overflow:hidden}
.sec-hd{padding:var(--sp3) var(--sp4);border-bottom:1px solid var(--line-soft);font-weight:700;font-size:var(--fs-md);display:flex;align-items:center;gap:8px}
.sec-bd{padding:var(--sp4)}
.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--sp3) var(--sp5)}
.info-item .k{font-size:var(--fs-xs);color:var(--tx-mute);margin-bottom:4px}
.info-item .v{font-size:var(--fs-md);color:var(--tx)}
.dep-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.dep-row:last-child{border-bottom:0}
.dep-row .di{width:28px;height:28px;border-radius:8px;background:var(--bg-surface-2);display:grid;place-items:center;color:var(--tx-soft);flex:none}
.dep-row .dt{flex:1;min-width:0}
.dep-row .dt b{font-size:var(--fs-md)}
.dep-row .dt span{display:block;font-size:var(--fs-xs);color:var(--tx-mute);margin-top:2px}
.mgr-layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:var(--sp4);align-items:start}
@media(max-width:900px){.mgr-layout{grid-template-columns:1fr}}
.mgr-list{background:var(--bg-surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.mgr-list .li{display:flex;align-items:center;gap:9px;padding:11px 12px;border-bottom:1px solid var(--line-soft);cursor:pointer}
.mgr-list .li:last-child{border-bottom:0}
.mgr-list .li:hover{background:var(--bg-surface-2)}
.mgr-list .li.on{background:var(--accent-soft)}
.mgr-list .li .li-t{font-size:var(--fs-md);font-weight:650;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mgr-list .li .li-s{font-size:var(--fs-xs);color:var(--tx-mute)}
.tabs{display:flex;gap:3px;padding:3px;background:var(--bg-base);border:1px solid var(--line);border-radius:var(--r-sm);margin-bottom:var(--sp4);flex-wrap:wrap}
.tabs button{padding:6px 12px;border-radius:var(--r-xs);font-size:var(--fs-sm);font-weight:600;color:var(--tx-mute)}
.tabs button.on{background:var(--bg-surface-2);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.25)}

/* 数据表 */
.data-table{width:100%;border-collapse:collapse;font-size:var(--fs-sm)}
.data-table th,.data-table td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line-soft)}
.data-table th{font-size:var(--fs-xs);color:var(--tx-mute);font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-bottom:1px solid var(--line)}
.data-table tr:last-child td{border-bottom:0}
.data-table td .mono{font-size:var(--fs-xs)}
.table-wrap{border:1px solid var(--line);border-radius:var(--r-sm);overflow:auto;background:var(--bg-base)}

/* 表单控件 */
.field{margin-bottom:var(--sp4)}
.field label{display:block;font-size:var(--fs-sm);font-weight:700;color:var(--tx-soft);margin-bottom:6px}
.field .desc{font-size:var(--fs-xs);color:var(--tx-mute);margin-top:5px;line-height:1.6}
.input,.select,textarea.input{width:100%;background:var(--bg-base);border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:8px 10px;font-size:var(--fs-md);outline:0}
.input:focus,.select:focus{border-color:var(--accent-line)}
textarea.input{min-height:80px;resize:vertical;line-height:1.6}
.form-row{display:flex;align-items:flex-start;gap:var(--sp4);padding:var(--sp4) 0;border-bottom:1px solid var(--line-soft)}
.form-row:last-child{border-bottom:0}
.form-row .fl{flex:1}
.form-row .fl b{font-size:var(--fs-md);display:block}
.form-row .fl span{font-size:var(--fs-sm);color:var(--tx-mute);display:block;margin-top:3px;line-height:1.6}
.form-row .fc{width:230px;flex:none}
.check-row{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-soft);cursor:pointer}
.check-row:last-child{border-bottom:0}
.check-box{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--line-strong);flex:none;display:grid;place-items:center;margin-top:1px;color:transparent}
.check-row.on .check-box{background:var(--accent);border-color:var(--accent);color:#06121f}
.check-row .ct b{font-size:var(--fs-md)}
.check-row .ct span{display:block;font-size:var(--fs-xs);color:var(--tx-mute);margin-top:2px}
.switch{width:38px;height:21px;border-radius:999px;background:var(--bg-active);position:relative;transition:background .15s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:15px;height:15px;border-radius:50%;background:var(--tx-soft);transition:transform .15s,background .15s}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(17px);background:#06121f}
.preset{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:var(--r-sm);cursor:pointer;background:var(--bg-base)}
.preset.on{border-color:var(--accent-line);background:var(--accent-soft)}
.preset .pv{width:58px;height:36px;border-radius:5px;border:1px solid var(--line-strong);flex:none;overflow:hidden;display:flex}
.preset .pv i{flex:1}
.preset .pt b{display:block;font-size:var(--fs-md)}
.preset .pt span{display:block;font-size:var(--fs-xs);color:var(--tx-mute);margin-top:3px}

/* 看板 */
.board{display:grid;grid-template-columns:repeat(5,minmax(190px,1fr));gap:var(--sp3);overflow:auto;padding-bottom:var(--sp3)}
.board-col{background:var(--bg-surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-height:300px}
.board-col .bh{display:flex;align-items:center;gap:7px;padding:var(--sp3);border-bottom:1px solid var(--line-soft);font-size:var(--fs-sm);font-weight:700}
.board-col .bh .n{margin-left:auto;color:var(--tx-mute);font-size:var(--fs-xs);background:var(--bg-surface-2);padding:1px 7px;border-radius:999px}
.board-col .bc{padding:var(--sp2);display:flex;flex-direction:column;gap:var(--sp2);flex:1}
.task-card{background:var(--bg-elevated);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px;cursor:pointer}
.task-card:hover{border-color:var(--line-strong)}
.task-card .tt{font-size:var(--fs-md);line-height:1.5;font-weight:600}
.task-card .tm{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:var(--fs-xs);color:var(--tx-mute);flex-wrap:wrap}

/* 弹层 / Toast */
.overlay{position:fixed;inset:0;z-index:60;display:none}
.overlay.show{display:block}
.overlay .veil{position:absolute;inset:0;background:rgba(3,6,10,.6);backdrop-filter:blur(2px)}
.popover{position:fixed;z-index:70;background:var(--bg-elevated);border:1px solid var(--line-strong);border-radius:var(--r);box-shadow:var(--shadow-pop);padding:var(--sp2);min-width:220px;display:none}
.popover.show{display:block}
.pop-title{font-size:var(--fs-xs);font-weight:700;letter-spacing:.1em;color:var(--tx-faint);text-transform:uppercase;padding:6px 10px}
.pop-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-sm);font-size:var(--fs-md);cursor:pointer;color:var(--tx-soft)}
.pop-item:hover{background:var(--bg-hover);color:var(--tx)}
.pop-item .pi{width:18px;color:var(--tx-mute)}
.pop-item.sel{color:var(--accent);background:var(--accent-soft)}
.pop-item .ck{margin-left:auto;color:var(--accent)}
.dialog{position:relative;margin:10vh auto 0;width:min(560px,94vw);max-height:80vh;overflow:auto;background:var(--bg-elevated);border:1px solid var(--line-strong);border-radius:var(--r-lg);box-shadow:var(--shadow-pop)}
.dialog-hd{padding:var(--sp5) var(--sp5) var(--sp3)}
.dialog-hd h3{margin:0;font-size:var(--fs-lg)}
.dialog-hd p{margin:6px 0 0;color:var(--tx-mute);font-size:var(--fs-sm);line-height:1.6}
.dialog-bd{padding:0 var(--sp5) var(--sp4)}
.dialog-ft{display:flex;justify-content:flex-end;gap:var(--sp2);padding:var(--sp4) var(--sp5);border-top:1px solid var(--line);background:var(--bg-surface);position:sticky;bottom:0}
.toast-wrap{position:fixed;right:var(--sp5);bottom:var(--sp5);z-index:90;display:flex;flex-direction:column;gap:var(--sp2)}
.toast{display:flex;align-items:center;gap:10px;background:var(--bg-elevated);border:1px solid var(--line-strong);border-left:3px solid var(--accent);border-radius:var(--r-sm);padding:11px 14px;box-shadow:var(--shadow-pop);font-size:var(--fs-md);min-width:250px;animation:tin .22s ease}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.toast.ok{border-left-color:var(--ok)} .toast.warn{border-left-color:var(--warn)} .toast.danger{border-left-color:var(--danger)}
.mobile-veil{display:none;position:fixed;inset:var(--top-h) 0 0 0;background:rgba(0,0,0,.5);z-index:12}
.statusbar{display:flex;align-items:center;gap:var(--sp4);padding:0 var(--sp4);background:var(--bg-rail);border-top:1px solid var(--line);font-size:var(--fs-xs);color:var(--tx-mute);overflow:hidden;white-space:nowrap}
.statusbar .it{display:flex;align-items:center;gap:6px;flex:none}
.statusbar .it b{color:var(--tx-soft);font-weight:600}
.statusbar .it .d{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.statusbar .sp{flex:1}

@media(max-width:1100px){:root{--side-w:232px;--panel-w:310px}.stage-body{padding-left:var(--sp5);padding-right:var(--sp5)}}
@media(max-width:900px){
  .workspace{grid-template-columns:var(--rail-w) 0 minmax(0,1fr) 0!important}
  .sidebar{position:fixed;left:var(--rail-w);top:var(--top-h);bottom:var(--status-h);width:280px;z-index:14;box-shadow:16px 0 40px rgba(0,0,0,.4);transform:translateX(-110%);transition:transform .2s ease}
  .workspace.side-open .sidebar{transform:none}
  .mobile-veil.show{display:block}
  .panel{position:fixed;right:0;top:var(--top-h);bottom:var(--status-h);width:330px;z-index:14;box-shadow:-16px 0 40px rgba(0,0,0,.4)}
  .crumb .seg:not(.cur){display:none}
  .run-chip{display:none}
}
@media(max-width:640px){
  .tool-btn span{display:none}.tool-btn{padding:6px 8px}.brand em{display:none}
  .board{grid-template-columns:repeat(5,240px)}
  .info-grid{grid-template-columns:1fr}
  .state-triad{grid-template-columns:1fr}
  .mgr-layout{grid-template-columns:1fr}
}

/* ===== 分层交互组件：抽屉 / 分步向导 / 确认 / 表单增强 ===== */
.overlay.layer-drawer .dialog-host{position:absolute;inset:0;display:flex;justify-content:flex-end}
.drawer{position:absolute;top:0;right:0;height:100%;width:min(560px,96vw);background:var(--bg-elevated);border-left:1px solid var(--line-strong);box-shadow:-24px 0 60px rgba(0,0,0,.45);display:flex;flex-direction:column;animation:din .22s ease}
@keyframes din{from{transform:translateX(28px);opacity:.6}to{transform:none;opacity:1}}
.drawer-hd{padding:var(--sp5);border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}

/* ======================= 通用 UI · 分层交互工具箱 ======================= */
function toast(msg,kind=''){
  const el=document.createElement('div');el.className='toast '+kind;
  el.innerHTML=`<span>${kind==='ok'?ic('check',16):kind==='warn'?ic('bolt',16):ic('summary',16)}</span><span>${esc(msg)}</span>`;
  $('#toastWrap').appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .25s';setTimeout(()=>el.remove(),260)},2800);
}
/* 动作注册表：把任意回调绑定到弹层按钮，避免污染全局分派 */
const ACT={n:0};
function reg(fn){const id='fn'+(++ACT.n);ACT[id]=fn;return id;}
function runAct(id){const fn=ACT[id];if(typeof fn==='function')fn();}
/* 弹层：center / drawer 两种形态 */
function openLayer(html,mode='center'){
  const ov=$('#overlay');
  ov.className='overlay show layer-'+mode;
  $('#dialogHost').className='dialog-host';
  $('#dialogHost').innerHTML=html;
}
function closeDialog(){$('#overlay').className='overlay';$('#dialogHost').innerHTML='';}
function closeLayer(){closeDialog();}
/* 居中对话框：兼容旧的位置参数，也支持配置对象 */
function dialog(title,desc,body,footer,opts={}){
  if(typeof title==='object'){const o=title;title=o.title;desc=o.desc;body=o.body;footer=o.footer;opts=o;}
  const size=opts.size||'md',ico=opts.icon;
  const hd=ico?`<div class="dh-row"><div class="dico">${ic(ico,18)}</div><div><h3>${esc(title)}</h3>${desc?`<p>${esc(desc)}</p>`:''}</div><button class="icon-btn x" data-action="close-dialog" title="关闭">${ic('x',16)}</button></div>`
    :`<h3>${esc(title)}</h3>${desc?`<p>${esc(desc)}</p>`:''}`;
  openLayer(`<div class="dialog size-${size}"><div class="dialog-hd">${hd}</div>
    <div class="dialog-bd">${body}</div><div class="dialog-ft">${footer||'<button class="btn ghost" data-action="close-dialog">关闭</button>'}</div></div>`,'center');
}
/* 右侧抽屉：详情 / 检查 / 长流程 */
function drawer(title,desc,body,footer,icon='summary'){
  openLayer(`<div class="drawer"><div class="drawer-hd"><div class="dico">${ic(icon,19)}</div><div><h3>${esc(title)}</h3>${desc?`<p>${esc(desc)}</p>`:''}</div><button class="icon-btn x" data-action="close-dialog" title="关闭">${ic('x',17)}</button></div>
    <div class="drawer-bd">${body}</div><div class="drawer-ft">${footer||'<button class="btn ghost" data-action="close-dialog">关闭</button>'}</div></div>`,'drawer');
}
/* 确认对话框：危险操作二次确认 */
function confirmDlg(o){
  dialog({title:o.title,desc:o.desc||'',icon:o.icon||'shield',size:'sm',
    body:`${o.detail||''}${o.impact?`<div class="impact">${o.impact}</div>`:''}`,
    footer:`<button class="btn ghost" data-action="close-dialog">取消</button><button class="btn ${o.danger?'danger-solid':'primary'}" data-action="ux-run" data-arg="${reg(()=>{closeDialog();if(o.onConfirm)o.onConfirm();})}">${esc(o.confirmText||'确认')}</button>`});
}
/* 分步向导：steps=[{title,body,onEnter}]，完成后调用 onFinish(values)=>{} */
function openWizard(o){
  const w=UX.wiz={title:o.title,desc:o.desc||'',icon:o.icon||'bolt',steps:o.steps,idx:0,data:{},onFinish:o.onFinish,size:o.size||'lg'};
  renderWizard();
}
function renderWizard(){
  const w=UX.wiz;if(!w)return;
  const step=w.steps[w.idx];
  if(step.onEnter)step.onEnter(w);
  const stepsHTML=w.steps.map((s,i)=>`<li class="st ${i<w.idx?'done':i===w.idx?'active':''}"><span class="num">${i<w.idx?ic('check',13):(i+1)}</span><span class="lb">${esc(s.title)}</span>${i<w.steps.length-1?'<span class="bar"></span>':''}</li>`).join('');
  const last=w.idx===w.steps.length-1;
  const footer=`<button class="btn ghost" data-action="wiz-cancel">取消</button>
    <span style="flex:1"></span>
    ${w.idx>0?`<button class="btn ghost" data-action="wiz-back">${ic('back',14)}上一步</button>`:''}
    <button class="btn primary" data-action="wiz-next">${last?ic('check',14)+' 完成':ic('chevron',14)+' 下一步'}</button>`;
  dialog({title:w.title,desc:w.desc,icon:w.icon,size:w.size,
    body:`<ul class="stepper">${stepsHTML}</ul><div class="wiz-body">${step.body(w)}</div>`,
    footer});
}
function wizCollect(){
  // 收集当前步骤表单值到 wiz.data（按 name 属性）
  const w=UX.wiz;if(!w)return;
  $$('#dialogHost [name]').forEach(el=>{w.data[el.name]=el.type==='checkbox'?el.checked:el.value;});
}
function wizNext(){
  const w=UX.wiz;if(!w)return;
  wizCollect();
  const step=w.steps[w.idx];
  if(step.validate){const err=step.validate(w);if(err){toast(err,'warn');return;}}
  if(w.idx<w.steps.length-1){w.idx++;renderWizard();}
  else{const data=w.data;UX.wiz=null;closeDialog();if(w.onFinish)w.onFinish(data);}
}

function showPopover(key,anchor){
  const cfg=POPOVERS[key];if(!cfg)return;
  const pop=$('#popover');let html=`<div class="pop-title">${cfg.title}</div>`;
  cfg.items.forEach(it=>{
    const selected=(key==='agent'&&state.composer.mode===it.arg)||(key==='approval'&&state.composer.approval===it.arg)||(key==='model'&&state.composer.model===it.arg)||(key==='strength'&&state.composer.strength===it.arg)||(key==='format'&&state.composer.format===it.arg);
    html+=`<div class="pop-item ${selected?'sel':''}" data-action="${it.act}" data-arg="${esc(it.arg)}" data-poptype="${key}"><span class="pi">${ic(it.ic,16)}</span><span><b style="display:block;font-weight:600">${esc(it.t)}</b>${it.d?`<small style="color:var(--tx-mute)">${esc(it.d)}</small>`:''}</span>${selected?'<span class="ck">'+ic('check',15)+'</span>':''}</div>`;
  });
  pop.innerHTML=html;pop.classList.add('show');popAnchor=anchor;
  const r=anchor.getBoundingClientRect();const w=pop.offsetWidth||260,h=pop.offsetHeight||200;
  let left=r.left,top=r.bottom+6;
  if(left+w>innerWidth-12)left=innerWidth-w-12;
  if(top+h>innerHeight-12)top=r.top-h-6;

}

function treeHTML(nodes,depth){
  return nodes.map(n=>{
    const pad=depth*14;
    const mark=n.mark?`<span class="badge" style="color:${n.mark==='M'?'var(--warn)':'var(--ok)'}">${n.mark}</span>`:'';
    if(n.type==='dir')return `<div class="tree-node" style="padding-left:${pad+8}px"><span class="caret">${ic('chevron',12)}</span><span class="fi folder">${ic('folder',15)}</span>${n.n}</div>${treeHTML(n.children||[],depth+1)}`;
    return `<div class="tree-node" style="padding-left:${pad+8}px"><span class="caret"></span><span class="fi">${ic('file',15)}</span>${n.n}${mark}</div>`;
  }).join('');
}

function probeRun(c,ok){

    i++;setTimeout(tick,480);
  };tick();

/* ======================= 交互分派 ======================= */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-action]');
  if(!t){if(!e.target.closest('#popover'))hidePopover();return;}
  const a=t.dataset.action,arg=t.dataset.arg;
  switch(a){
    case 'entry':
      state.entry=arg;state.boardOpen=false;
      if((arg==='code'||arg==='work')){state.inspector=state.inspector&&(INSPECTOR_TABS[arg].some(x=>x[0]===state.inspector))?state.inspector:null;}
      else state.inspector=null;
      state.terminal=false;state.sideOpenMobile=false;hidePopover();render();break;
    case 'toggle-side':
      if(innerWidth<=900){state.sideOpenMobile=!state.sideOpenMobile;render();}
      else{state.sideCollapsed=!state.sideCollapsed;render();}break;
    case 'close-mobile':state.sideOpenMobile=false;render();break;
    case 'project':state.project=arg;const f=CODE_PROJECTS.find(p=>p.id===arg).sessions[0];if(f)state.session=f.id;render();break;
    case 'session':
      state.session=arg;state.boardOpen=false;
      const sess=currentSession();
      state.approval=(sess.kind==='eng'&&arg==='s1')?'pending':'approved';render();break;
    case 'workspace':state.workspace=arg;state.workDoc=WORK_SPACES.find(w=>w.id===arg).docs[0].id;render();break;
    case 'workdoc':state.workDoc=arg;render();break;
    case 'new-session':dlgNewSession();break;
    case 'new-workdoc':dlgNewWorkDoc();break;

    case 'db-edit':{const db=DBS.find(x=>x.id===arg);if(!db)break;dialog({title:'编辑数据源资料',desc:db.name,icon:'edit',size:'md',
      body:`<div class="field"><label>数据源名称</label><input class="input" name="dbName" value="${esc(db.name)}"/></div>
        <div class="form-grid"><div class="field"><label>性质</label><input class="input" name="dbKind" value="${esc(db.kind||'脱敏快照')}"/></div>
        <div class="field"><label>表数量</label><input class="input" name="dbTables" type="number" value="${db.tables}"/></div></div>
        <div class="field"><label>备注</label><input class="input" name="dbNote" value="${esc(db.note)}"/></div>`,
      footer:`<button class="btn ghost" data-action="close-dialog">取消</button><button class="btn primary" data-action="ux-run" data-arg="${reg(()=>{const v={};$$('#dialogHost [name]').forEach(e=>v[e.name]=e.value);db.name=v.dbName||db.name;db.kind=v.dbKind;db.tables=+v.dbTables||0;db.note=v.dbNote;closeDialog();render();toast('数据源资料已更新','ok');})}">保存修改</button>`});break;}
    case 'db-del':{const db=DBS.find(x=>x.id===arg);if(!db)break;confirmDlg({title:'删除数据源资料',desc:db.name,icon:'trash',danger:true,confirmText:'确认删除',
      detail:`<div class="dep-row"><div class="di">${ic('db',15)}</div><div class="dt"><b>${esc(db.name)}</b><span>${db.tables} 表 · ${db.status==='ready'?'只读可用':'未授权'}</span></div></div>`,
      impact:`删除仅移除本地登记的资料快照，<b>不删除任何真实数据库或文件</b>。引用该数据源的 SQL 场景需重新选择数据源。`,
      onConfirm:()=>{const i=DBS.findIndex(x=>x.id===db.id);if(i>=0)DBS.splice(i,1);state.mgr.db=DBS[0]?DBS[0].id:null;render();toast('数据源资料已删除','warn');}});break;}
    case 'cap-group':state.mgr.capGroup=arg;state.mgr.cap=(CAPS.find(x=>x.group===arg)||{}).id||state.mgr.cap;render();break;
    case 'skill-register':wizSkillRegister(arg);break;
    case 'skill-add':dlgSkillAdd();break;
    case 'cap-refresh':{
      toast('正在刷新能力盘点…');
      setTimeout(()=>{CAPS.forEach(c=>{if(c.avail==='missing'&&c.id==='cp4'){c.binding='未连接';}});render();
        dialog({title:'能力盘点结果',desc:'只读盘点 · 不执行 --version · 不触发物理迁移',icon:'grid',size:'md',
          body:`<div class="result-box"><div class="rb-hd">${ic('grid',14)}盘点摘要</div><div class="rb-bd"><div class="kv"><span class="k">扫描条目</span><span class="v">${CAPS.length}</span></div><div class="kv"><span class="k">可用</span><span class="v">${CAPS.filter(c=>c.avail==='ready').length}</span></div><div class="kv"><span class="k">版本未知</span><span class="v">${CAPS.filter(c=>c.version==='unknown').length}</span></div></div></div>
          <div class="wiz-note">未知目录不虚构能力；UNKNOWN 条目需有界探测或人工补充事实后才可判定。</div>`});},500);break;}
    case 'cap-probe':drawerCapProbe(arg);break;
    case 'cap-clear-cache':confirmDlg({title:'清除探测缓存',desc:'仅清除本机缓存的版本探测结果',icon:'trash',danger:true,confirmText:'清除缓存',
      impact:`清除后相关能力版本回到 <b>unknown</b>，需重新有界探测；不会影响实际绑定或任务状态。`,
      onConfirm:()=>{CAPS.forEach(c=>{if(c.version!=='unknown'&&c.kind!=='只读工具')c.version='unknown';});render();toast('探测缓存已清除','warn');}});break;
    case 'cap-check':drawerCapCheck(arg);break;
    case 'plugin-toggle':confirmPluginToggle(arg);break;
    case 'plugin-observe':drawerPluginObserve(arg);break;
    case 'set-theme':state.theme=arg;render();break;
    case 'set-fs':state.fontSize=arg;render();break;
    case 'set-density':state.density=arg;render();break;
    case 'toggle-motion':state.reduceMotion=!state.reduceMotion;render();break;
    case 'remove-ref':state.refs.splice(+arg,1);renderComposer();break;
    case 'pop':showPopover(arg,t);break;
    case 'pop-add':hidePopover();if(!state.refs.find(r=>r.t===arg)){state.refs.push({t:arg});renderComposer();toast('已添加引用：'+arg,'ok');}else toast('引用已存在');break;
    case 'pick-mode':state.composer.mode=arg;hidePopover();renderComposer();break;
    case 'pick-approval':state.composer.approval=arg;hidePopover();renderComposer();break;
    case 'pick-model':state.composer.model=arg;hidePopover();renderComposer();renderTopTools();renderStatusbar();break;
    case 'pick-strength':state.composer.strength=arg;hidePopover();renderComposer();break;
    case 'pick-format':state.composer.format=arg;hidePopover();renderComposer();break;
    case 'send':
      state.composerText='';state.approval=state.entry==='code'?'pending':state.approval;state.taskState='running';render();
      toast(state.entry==='code'?'已发送 · 进入受控执行与审批流程（模拟）':'已发送 · 生成文档草稿（模拟）','ok');break;
    case 'close-dialog':closeDialog();UX.wiz=null;break;
    case 'ux-run':runAct(arg);break;
    case 'seg':{
      const idx=arg.indexOf(':');const key=arg.slice(0,idx),val=arg.slice(idx+1);
      UX.seg=UX.seg||{};UX.seg[key]=val;
      const grp=t.closest('.seg');if(grp)$$('.seg button',grp).forEach(b=>b.classList.toggle('on',b.dataset.arg===arg));break;}
    case 'wiz-next':wizNext();break;
    case 'wiz-back':{const w=UX.wiz;if(w&&w.idx>0){wizCollect();w.idx--;renderWizard();}break;}
    case 'wiz-cancel':UX.wiz=null;closeDialog();break;
    case 'doc-save':dlgDocSaveDraft();break;
    case 'doc-download':dlgDocDownload();break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target.closest('[data-action]');
  if(!t)return;
  if(t.dataset.action==='proto-text'){
    const i=+t.dataset.arg,p=state.proto;
    if(p.canvas[i]){p.canvas[i].txt=t.value;p.drafted=false;const nb=document.querySelectorAll('.proto-node')[i];if(nb){const b=nb.querySelector('.pn-body');if(b)b.textContent=t.value;}}
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){hidePopover();closeDialog();}});
window.addEventListener('resize',()=>{hidePopover();if(innerWidth>900&&state.sideOpenMobile){state.sideOpenMobile=false;render();}});

/* 启动 */
render();
</script>
</body>
</html>
