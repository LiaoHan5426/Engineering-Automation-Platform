packages:
  - apps/*
  - packages/*
  - internal/*

autoDedupe: true

peerDependencyRules:
  allowedVersions:
    vite: '>=1.0.0'

catalogs:
  frontend:
    vue: ^3.5.0
    vue-i18n: ^11.1.0
    axios: ^1.8.0
    nprogress: ^0.2.0
    tailwindcss: ^4.1.0
    '@tailwindcss/vite': ^4.1.0
  tooling:
    vite-plus: ^1.0.0
    vite: ^8.0.0
    typescript: ^6.0.0
    '@vitejs/plugin-vue': ^6.0.0
    '@types/nprogress': ^0.2.3
  style:
    stylelint: ^16.20.0
    postcss-html: ^1.8.0
    stylelint-config-recess-order: ^7.4.0
    stylelint-config-standard: ^38.0.0

allowBuilds:
  esbuild: true
  rolldown: true
