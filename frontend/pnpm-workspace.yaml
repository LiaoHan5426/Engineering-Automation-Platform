packages:
  - apps/*
  - packages/*
  - internal/*

autoDedupe: true

peerDependencyRules:
  allowedVersions:
    vite: ">=1.0.0"

catalogs:
  frontend:
    vue: ^3.5.44
    vue-i18n: ^11.1.0
    axios: ^1.8.0
    nprogress: ^0.2.0
    tailwindcss: ^4.3.3
    "@tailwindcss/vite": ^4.3.3
  tooling:
    vite-plus: ^1.4.0
    vite: npm:@voidzero-dev/vite-plus-core@^1.4.0
    typescript: ^6.0.3
    "@vitejs/plugin-vue": ^6.0.10
    "@types/nprogress": ^0.2.3
  types:
    "@types/node": ^24.19.2
  style:
    stylelint: ^16.26.1
    postcss-html: ^1.8.1
    stylelint-config-recess-order: ^7.8.2
    stylelint-config-standard: ^38.0.0

allowBuilds:
  esbuild: true
  rolldown: true
  electron: true

minimumReleaseAgeExclude:
  - "@vxe-ui/core@4.5.4"
