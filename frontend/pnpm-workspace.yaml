packages:
  - apps/*
  - packages/* # includes the shared @eap/icons visual leaf package
  - internal/*
  - scripts/*

autoDedupe: true

catalogs:
  frontend:
    vue: ^3.5.44
    vue-i18n: ^11.1.0
    axios: ^1.8.0
    nprogress: ^0.2.0
    tailwindcss: ^4.3.4
    '@tailwindcss/vite': ^4.3.4
  tooling:
    vite-plus: 1.8.0
    vite: npm:@voidzero-dev/vite-plus-core@8.3.8001
    typescript: ^6.0.3
    '@vitejs/plugin-vue': ^6.0.10
    '@types/nprogress': ^0.2.3
  types:
    '@types/node': ^24.19.2
  style:
    stylelint: ^16.26.1
    postcss-html: ^1.8.1
    stylelint-config-recess-order: ^7.10.0
    stylelint-config-standard: ^38.0.0

allowBuilds:
  esbuild: true
  rolldown: true
  electron: true

minimumReleaseAgeExclude:
  - '@vxe-ui/core@4.5.4'
  - '@voidzero-dev/vite-plus-core@8.3.8001'
  - '@voidzero-dev/vite-plus-darwin-arm64@1.8.0'
  - '@voidzero-dev/vite-plus-darwin-x64@1.8.0'
  - '@voidzero-dev/vite-plus-linux-arm64-gnu@1.8.0'
  - '@voidzero-dev/vite-plus-linux-x64-gnu@1.8.0'
  - '@voidzero-dev/vite-plus-linux-x64-musl@1.8.0'
  - '@voidzero-dev/vite-plus-win32-arm64-msvc@1.8.0'
  - '@voidzero-dev/vite-plus-win32-x64-msvc@1.8.0'
  - vite-plus@1.8.0
  - '@voidzero-dev/vite-plus-linux-arm64-musl@1.8.0'
overrides:
  vite@*: catalog:tooling
