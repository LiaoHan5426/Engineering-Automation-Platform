# This transcript includes the no-desktop state on every test platform, so the
# card header stays a label and rows preview in the Sidebar.
- id: session-controller
  config:
    nativeOpen: false

# The recorded calls name Bash and use POSIX commands on every replay host.
- id: bash-sandbox
  disabled: false
- id: pwsh-sandbox
  disabled: true
- id: tool-bash
  disabled: false
- id: tool-pwsh
  disabled: true
